<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{background:#000;color:#0f0;font-family:monospace;padding:10px}input,textarea{width:100%;background:#111;color:#0f0;border:1px solid #0f0;padding:10px;border-radius:8px;box-sizing:border-box;margin:5px 0}button{width:100%;padding:15px;background:#0f0;color:#000;font-weight:bold;border:0;border-radius:10px;font-size:18px}</style></head><body>
<h2 style="text-align:center">HTML TO APK BUILDER</h2>
<input id="repo" placeholder="username/repo contoh: jaya123/html-to-apk-builder" value="">
<input id="token" type="password" placeholder="Token ghp_xxx">
<input id="appName" value="DATA HK V10.9">
<textarea id="htmlCode" rows="18" placeholder="Paste FULL HTML DATA HK kamu di sini"></textarea>
<button onclick="build()">🚀 BUILD APK DATA HK</button><div id="log"></div>
<script>
let saved=localStorage;
document.getElementById('token').value=saved.getItem('t')||'';
document.getElementById('repo').value=saved.getItem('r')||'';
function build(){
 let repo=document.getElementById('repo').value.trim();
 let token=document.getElementById('token').value.trim();
 let html=document.getElementById('htmlCode').value;
 let name=document.getElementById('appName').value;
 if(!repo||!token||!html){alert('Isi REPO, TOKEN, dan HTML dulu!');return}
 saved.setItem('t',token);saved.setItem('r',repo);
 document.getElementById('log').innerHTML='⏳ Mengirim...';
 let b64=btoa(unescape(encodeURIComponent(html)));
 fetch(`https://api.github.com/repos/${repo}/dispatches`,{
  method:'POST',
  headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'},
  body:JSON.stringify({event_type:'build_apk',client_payload:{html:b64,name:name}})
 }).then(r=>{document.getElementById('log').innerHTML=r.ok?'✅ Terkirim! Cek Actions 2 menit lagi jadi hijau.':'❌ Gagal: '+r.status+' cek repo & token REPO';});
}
</script></body></html>
