name: Build APK DATA HK
on:
  repository_dispatch:
    types: [build_apk]
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject Custom HTML
        run: |
          if [! -z "${{ github.event.client_payload.html }}" ]; then
            echo "${{ github.event.client_payload.html }}" | base64 --decode > index.html
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install -g cordova
          cordova create apk com.hkpkum.app DATAHK
          cp index.html apk/www/index.html
          cd apk
          cordova platform add android
          cordova build android --debug
      - uses: actions/upload-artifact@v4
        with:
          name: DATA-HK-APK
          path: apk/platforms/android/app/build/outputs/apk/debug/app-debug.apk
