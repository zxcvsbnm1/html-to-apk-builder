name: Build APK DATA HK

on:
  repository_dispatch:
    types: [build_apk]
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Inject Custom HTML if exists
        run: |
          if [ ! -z "${{ github.event.client_payload.html }}" ]; then
            echo ">> Injecting DATA HK HTML..."
            echo "${{ github.event.client_payload.html }}" | base64 --decode > injected.html
            # Pakai injected.html sebagai index utama
            cp injected.html index.html
          else
            echo ">> No payload, using existing index.html"
          fi
          ls -lh index.html

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Build APK
        run: |
          npm install -g cordova
          cordova create apk com.hkpkum.app DATAHK
          cp index.html apk/www/index.html
          cd apk
          cordova platform add android
          cordova build android --debug
          
      - name: Upload APK DATA HK
        uses: actions/upload-artifact@v4
        with:
          name: DATA-HK-APK-${{ github.event.client_payload.name }}
          path: apk/platforms/android/app/build/outputs/apk/debug/app-debug.apk
