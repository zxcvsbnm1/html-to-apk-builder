name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Build APK
        run: |
          npm install -g cordova
          cordova create apk com.hkpkum.app HKPKUM
          cp index.html apk/www/index.html || cp -r * apk/www/ || true
          cd apk
          cordova platform add android
          cordova build android --debug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HKPKUM-APK
          path: apk/platforms/android/app/build/outputs/apk/debug/app-debug.apk
